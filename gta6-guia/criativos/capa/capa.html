<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Bungee;src:url(../fonts/Bungee-Regular.ttf)}
*{box-sizing:border-box;margin:0}
body{width:800px;height:800px;overflow:hidden;font-family:Inter,sans-serif;
  background:radial-gradient(900px 500px at 50% 0%,#3b0f5c 0%,transparent 70%),linear-gradient(180deg,#14072a 0%,#2a0b49 45%,#5a1166 75%,#b8236f 100%);position:relative}
.sun{position:absolute;left:50%;top:205px;width:560px;height:560px;margin-left:-280px;border-radius:50%;
  background:linear-gradient(180deg,#ffd24a 0%,#ff8a3c 38%,#ff2e88 70%,#b31eff 100%);
  -webkit-mask:repeating-linear-gradient(180deg,#000 0 26px,transparent 26px 34px);opacity:.95;filter:drop-shadow(0 0 60px rgba(255,90,90,.6))}
.grid{position:absolute;left:-200px;right:-200px;bottom:-40px;height:260px;transform:perspective(380px) rotateX(58deg);
  background:linear-gradient(transparent 0 0),repeating-linear-gradient(90deg,rgba(25,227,255,.55) 0 2px,transparent 2px 70px),repeating-linear-gradient(0deg,rgba(25,227,255,.55) 0 2px,transparent 2px 46px);
  -webkit-mask:linear-gradient(transparent,#000 40%)}
.palm{position:absolute;bottom:0;color:#0d0418}
.title{position:absolute;top:40px;left:0;right:0;text-align:center;font-family:Bungee;line-height:.95}
.t1,.t2{display:block;background:linear-gradient(90deg,#ff2e88,#ff7ac0 45%,#19e3ff);-webkit-background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,46,136,.65)) drop-shadow(0 4px 0 #12051f)}
.t1{font-size:96px;letter-spacing:4px}.t2{font-size:92px}
.sub{position:absolute;top:252px;left:0;right:0;text-align:center;color:#fff;font-weight:900;font-size:27px;letter-spacing:3px;text-transform:uppercase;
  text-shadow:0 2px 0 #12051f,0 0 14px rgba(25,227,255,.6)}
.phone{position:absolute;width:236px;height:420px;border-radius:34px;background:#0a0512;padding:10px;
  box-shadow:0 0 0 3px #3a2560,0 30px 60px rgba(0,0,0,.6),0 0 40px rgba(255,46,136,.35)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:26px;display:block}
.p1{left:300px;top:340px;transform:rotate(-4deg);z-index:3}
.p2{left:470px;top:370px;transform:rotate(7deg) scale(.9);z-index:2;opacity:.95}
.badge{position:absolute;z-index:4;font-weight:900;color:#12051f;border-radius:14px;padding:10px 14px;line-height:1.05;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.b1{left:58px;top:370px;background:linear-gradient(90deg,#ffd24a,#ffa34a);font-size:22px;transform:rotate(-5deg)}
.b1 b{display:block;font-family:Bungee;font-weight:400;font-size:44px}
.b2{left:70px;top:505px;background:#19e3ff;font-size:20px;transform:rotate(-3deg)}
.b2 b{display:block;font-family:Bungee;font-weight:400;font-size:36px}
.b3{left:96px;top:625px;background:#3df5a6;font-size:19px;transform:rotate(-6deg)}
</style></head><body>
<div class="sun"></div>
<div class="grid"></div>
<svg class="palm" style="left:-30px;width:300px;height:420px" viewBox="0 0 240 340" fill="currentColor"><path d="M118 340c4-90 10-160 30-215l6 3c-16 52-22 120-24 212z"/><path d="M150 128c-22-16-58-20-84-4 26-6 54 0 74 12-30-3-56 10-68 33 20-16 48-22 70-16-16 10-26 28-26 48 12-22 30-36 40-38 6 16 6 38-4 58 20-20 22-48 14-70 22 4 44 20 54 42 0-30-22-52-48-62 22-10 52-6 72 6-14-22-46-32-72-22 10-16 30-26 50-30-26-6-52 4-66 22 0-14 6-26 16-36-20 6-32 22-36 42z"/></svg>
<svg class="palm" style="right:-40px;width:330px;height:460px;transform:scaleX(-1)" viewBox="0 0 240 340" fill="currentColor"><path d="M118 340c4-90 10-160 30-215l6 3c-16 52-22 120-24 212z"/><path d="M150 128c-22-16-58-20-84-4 26-6 54 0 74 12-30-3-56 10-68 33 20-16 48-22 70-16-16 10-26 28-26 48 12-22 30-36 40-38 6 16 6 38-4 58 20-20 22-48 14-70 22 4 44 20 54 42 0-30-22-52-48-62 22-10 52-6 72 6-14-22-46-32-72-22 10-16 30-26 50-30-26-6-52 4-66 22 0-14 6-26 16-36-20 6-32 22-36 42z"/></svg>
<div class="title"><span class="t1">VICE</span><span class="t2">DETONADO</span></div>
<div class="sub">O detonado completo do GTA 6</div>
<div class="phone p2"><img src="missao.png"></div>
<div class="phone p1"><img src="app.png"></div>
<div class="badge b1"><b>135</b>missões passo a passo</div>
<div class="badge b2"><b>+700</b>itens do 100%</div>
<div class="badge b3">✓ Em português</div>
</body></html>
