<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:760px;overflow:hidden;position:relative;
  background:radial-gradient(700px 420px at 50% 10%,#3b0f5c 0%,transparent 70%),linear-gradient(180deg,#14072a 0%,#22093d 55%,#4a0f5e 100%)}
.sun{position:absolute;left:50%;top:120px;width:640px;height:640px;margin-left:-320px;border-radius:50%;
  background:linear-gradient(180deg,#ffd24a 0%,#ff8a3c 38%,#ff2e88 70%,#b31eff 100%);
  -webkit-mask:repeating-linear-gradient(180deg,#000 0 28px,transparent 28px 36px);opacity:.55;filter:drop-shadow(0 0 70px rgba(255,90,90,.5))}
.grid{position:absolute;left:-200px;right:-200px;bottom:-40px;height:240px;transform:perspective(380px) rotateX(58deg);
  background:repeating-linear-gradient(90deg,rgba(25,227,255,.45) 0 2px,transparent 2px 70px),repeating-linear-gradient(0deg,rgba(25,227,255,.45) 0 2px,transparent 2px 46px);
  -webkit-mask:linear-gradient(transparent,#000 40%)}
.palm{position:absolute;bottom:0;color:#0d0418;opacity:.9}
.phone{position:absolute;width:330px;height:566px;border-radius:44px;background:#0a0512;padding:13px;
  box-shadow:0 0 0 4px #3a2560,0 40px 80px rgba(0,0,0,.6),0 0 50px rgba(255,46,136,.35)}
.phone:before{display:none;content:"";position:absolute;top:22px;left:50%;width:90px;height:22px;margin-left:-45px;border-radius:99px;background:#0a0512;z-index:2}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:34px;display:block}
.p1{left:300px;top:95px;transform:rotate(-5deg);z-index:3}
.p2{left:590px;top:120px;transform:rotate(6deg) scale(.92);z-index:2}
</style></head><body>
<div class="sun"></div><div class="grid"></div>
