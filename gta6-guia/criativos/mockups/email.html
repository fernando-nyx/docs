<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:432px;height:768px;font-family:Inter,sans-serif;background:#f6f6f8;color:#1b1b1f;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:18px 18px 10px;font-size:15px;color:#555}.top b{flex:1}
.sub{padding:6px 18px 14px;font-size:22px;font-weight:800;line-height:1.25}
.from{display:flex;gap:10px;align-items:center;padding:0 18px 14px;border-bottom:1px solid #e4e4ea}
.av{width:40px;height:40px;border-radius:50%;background:url(icon.svg) center/cover}
.from div{font-size:14px}.from small{color:#777}
.body{padding:18px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.hero{height:120px;border-radius:12px;background:linear-gradient(180deg,#2a0b49,#5a1166 60%,#ff2e88);position:relative;overflow:hidden;margin-bottom:14px}
.hero:after{content:"";position:absolute;right:-20px;top:20px;width:150px;height:150px;border-radius:50%;background:linear-gradient(180deg,#ffd24a,#ff8a3c 40%,#ff2e88);-webkit-mask:repeating-linear-gradient(180deg,#000 0 9px,transparent 9px 12px)}
.hero span{position:absolute;left:14px;top:38px;font-family:Bungee,Inter;font-weight:900;font-size:26px;color:#fff;line-height:1;text-shadow:0 0 12px #ff2e88;z-index:2}
p{font-size:15px;line-height:1.5;margin:8px 0}.kv{background:#f1eefa;border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}.kv b{color:#5a1166}
.btn{display:block;text-align:center;margin-top:14px;padding:14px;border-radius:12px;font-weight:900;color:#12051f;background:linear-gradient(90deg,#ff2e88,#19e3ff)}
</style></head><body>
<div class="top">‹ <b>Caixa de entrada</b> ☆</div>
<div class="sub">Seu acesso ao Vice Detonado está liberado! 🎮</div>
<div class="from"><div class="av"></div><div><b>Vice Detonado</b><br><small>agora · para mim</small></div></div>
<div class="body"><div class="card">
<div class="hero"><span>VICE<br>DETONADO</span></div>
<p>Pronto! Seu detonado completo do GTA VI já está no ar.</p>
<div class="kv">Login: <b>o e-mail desta compra</b><br>Senha: <b>12345678</b></div>
<a class="btn">ACESSAR AGORA</a>
<p style="font-size:13px;color:#666">Dica: no celular, toque em "Adicionar à tela inicial".</p>
</div></div></body></html>
