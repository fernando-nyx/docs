<!doctype html>
<!-- Topo dos e-mails (1200x480, exibido a 600x240). ?v=acesso | ?v=cancelado. Render: node render-topo.js -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@600;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:480px;overflow:hidden;font-family:Inter,sans-serif;position:relative;
  background:radial-gradient(900px 420px at 50% 0%,#3b0f5c 0%,transparent 70%),linear-gradient(180deg,#14072a 0%,#2a0b49 45%,#5a1166 78%,#b8236f 100%)}
.sun{position:absolute;left:50%;top:150px;width:520px;height:520px;margin-left:-260px;border-radius:50%;
  background:linear-gradient(180deg,#ffd24a 0%,#ff8a3c 38%,#ff2e88 70%,#b31eff 100%);
  -webkit-mask:repeating-linear-gradient(180deg,#000 0 24px,transparent 24px 32px);opacity:.95;filter:drop-shadow(0 0 60px rgba(255,90,90,.6))}
.grid{position:absolute;left:-300px;right:-300px;bottom:-40px;height:200px;transform:perspective(380px) rotateX(60deg);
  background:repeating-linear-gradient(90deg,rgba(25,227,255,.55) 0 2px,transparent 2px 80px),repeating-linear-gradient(0deg,rgba(25,227,255,.55) 0 2px,transparent 2px 46px);
  -webkit-mask:linear-gradient(transparent,#000 40%)}
.palm{position:absolute;bottom:0;color:#0d0418}
.title{position:absolute;top:58px;left:0;right:0;text-align:center;font-family:Bungee;line-height:.95}
.title span{display:block;background:linear-gradient(90deg,#ff2e88,#ff7ac0 45%,#19e3ff);-webkit-background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,46,136,.65)) drop-shadow(0 5px 0 #12051f)}
.t1{font-size:112px;letter-spacing:6px}.t2{font-size:108px}
.tag{position:absolute;left:50%;bottom:44px;transform:translateX(-50%) rotate(-2deg);white-space:nowrap;font-weight:900;font-size:30px;letter-spacing:2px;
  text-transform:uppercase;color:#12051f;padding:12px 26px;border-radius:16px;box-shadow:0 12px 28px rgba(0,0,0,.45)}
.acesso .tag{background:linear-gradient(90deg,#3df5a6,#19e3ff)}
/* cancelado: mesma cena, apagada */
.cancelado .sun,.cancelado .grid{filter:grayscale(.85) brightness(.55)}
.cancelado .title span{background:linear-gradient(90deg,#b3a3d1,#e6ddf5);-webkit-background-clip:text;filter:drop-shadow(0 5px 0 #12051f)}
.cancelado .tag{background:#e6ddf5}
</style></head><body>
<div class="sun"></div>
<div class="grid"></div>
<svg class="palm" style="left:-20px;width:300px;height:420px" viewBox="0 0 240 340" fill="currentColor"><path d="M118 340c4-90 10-160 30-215l6 3c-16 52-22 120-24 212z"/><path d="M150 128c-22-16-58-20-84-4 26-6 54 0 74 12-30-3-56 10-68 33 20-16 48-22 70-16-16 10-26 28-26 48 12-22 30-36 40-38 6 16 6 38-4 58 20-20 22-48 14-70 22 4 44 20 54 42 0-30-22-52-48-62 22-10 52-6 72 6-14-22-46-32-72-22 10-16 30-26 50-30-26-6-52 4-66 22 0-14 6-26 16-36-20 6-32 22-36 42z"/></svg>
<svg class="palm" style="right:-30px;width:320px;height:450px;transform:scaleX(-1)" viewBox="0 0 240 340" fill="currentColor"><path d="M118 340c4-90 10-160 30-215l6 3c-16 52-22 120-24 212z"/><path d="M150 128c-22-16-58-20-84-4 26-6 54 0 74 12-30-3-56 10-68 33 20-16 48-22 70-16-16 10-26 28-26 48 12-22 30-36 40-38 6 16 6 38-4 58 20-20 22-48 14-70 22 4 44 20 54 42 0-30-22-52-48-62 22-10 52-6 72 6-14-22-46-32-72-22 10-16 30-26 50-30-26-6-52 4-66 22 0-14 6-26 16-36-20 6-32 22-36 42z"/></svg>
<div class="title"><span class="t1">VICE</span><span class="t2">DETONADO</span></div>
<div class="tag" id="tag"></div>
<script>
  const v = new URLSearchParams(location.search).get('v') || 'acesso';
  document.body.className = v;
  document.getElementById('tag').textContent = v === 'cancelado' ? 'Pedido cancelado' : '✓ Acesso liberado';
</script>
</body></html>
